<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agent Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f23; color: #e0e0e0; height: 100vh; display: flex;
      justify-content: center; align-items: center;
    }
    .app {
      width: 100%; max-width: 720px; height: 100vh; max-height: 800px;
      display: flex; flex-direction: column; background: #1a1a2e;
      border-radius: 16px; box-shadow: 0 8px 40px rgba(0,0,0,.5); overflow: hidden;
      margin: 16px;
    }
    header {
      padding: 20px 24px; background: #16213e; border-bottom: 1px solid #2a2a4a;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    header p { font-size: 13px; color: #888; margin-top: 2px; }

    .chat { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
    .chat::-webkit-scrollbar { width: 6px; }
    .chat::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 3px; }

    .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.55; font-size: 14px; animation: fadeIn .2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .message.user { align-self: flex-end; background: #4f46e5; color: #fff; border-bottom-right-radius: 4px; }
    .message.ai { align-self: flex-start; background: #2a2a4a; color: #e0e0e0; border-bottom-left-radius: 4px; }
    .message.ai .label { font-size: 11px; font-weight: 600; color: #818cf8; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
    .message.ai.loading .dot-pulse { display: inline-flex; }
    .message.ai .dot-pulse { display: none; align-items: center; gap: 4px; padding: 4px 0; }
    .message.ai .dot-pulse span {
      width: 8px; height: 8px; background: #818cf8; border-radius: 50%; display: inline-block;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .message.ai .dot-pulse span:nth-child(2) { animation-delay: .2s; }
    .message.ai .dot-pulse span:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse {
      0%, 80%, 100% { transform: scale(.6); opacity: .4; }
      40% { transform: scale(1); opacity: 1; }
    }
    .message.ai .text { display: block; }
    .message.ai.loading .text { display: none; }

    .message.ai pre {
      background: #111; border: 1px solid #333; border-radius: 8px; padding: 14px 16px;
      overflow-x: auto; margin: 8px 0; position: relative;
    }
    .message.ai pre code {
      font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
      font-size: 13px; line-height: 1.6; color: #e0e0e0; white-space: pre;
    }
    .message.ai pre .copy-btn {
      position: absolute; top: 6px; right: 6px; background: #2a2a4a; border: 1px solid #444;
      color: #aaa; font-size: 11px; padding: 4px 10px; border-radius: 5px; cursor: pointer;
      transition: background .2s, color .2s;
    }
    .message.ai pre .copy-btn:hover { background: #4f46e5; color: #fff; }
    .message.ai pre .copy-btn.copied { background: #22c55e; color: #fff; border-color: #22c55e; }
    .message.ai :not(pre) > code {
      background: #2a2a4a; padding: 2px 6px; border-radius: 4px; font-size: 13px;
      font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace; color: #f472b6;
    }
    .message.ai p { margin: 6px 0; }
    .message.ai br { content: ''; display: block; margin: 4px 0; }

    .message.ai.error { border-left: 3px solid #ef4444; background: #2a1a1a; }
    .message.ai.error .label { color: #ef4444; }

    .placeholder {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; gap: 12px; text-align: center; padding: 40px;
    }
    .placeholder .icon { font-size: 48px; opacity: .5; }
    .placeholder p { font-size: 14px; max-width: 280px; line-height: 1.5; }

    .input-area {
      padding: 16px 24px 20px; background: #16213e; border-top: 1px solid #2a2a4a;
    }
    .input-row { display: flex; gap: 10px; }
    .input-row input {
      flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid #2a2a4a;
      background: #1a1a2e; color: #e0e0e0; font-size: 14px; outline: none; transition: border .2s;
    }
    .input-row input:focus { border-color: #4f46e5; }
    .input-row input::placeholder { color: #555; }
    .input-row button {
      padding: 12px 24px; border-radius: 10px; border: none; background: #4f46e5;
      color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .2s, transform .1s;
      white-space: nowrap;
    }
    .input-row button:hover { background: #6366f1; }
    .input-row button:active { transform: scale(.97); }
    .input-row button:disabled { background: #3b3b5c; cursor: not-allowed; transform: none; }

    .error-msg { display: none; color: #ef4444; font-size: 12px; margin-top: 6px; }
    .error-msg.visible { display: block; }

    @media (max-width: 600px) {
      .app { max-height: 100vh; margin: 0; border-radius: 0; }
      .message { max-width: 90%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>AI Agent Chat</h1>
      <p>Powered by Gemini</p>
    </header>

    <div class="chat" id="chat" role="log" aria-live="polite">
      <div class="placeholder" id="placeholder">
        <div class="icon">&#129302;</div>
        <p>Ask me anything — I'm here to help!</p>
      </div>
    </div>

    <div class="input-area">
      <div class="input-row">
        <input type="text" id="input" placeholder="Type your message..." autofocus>
        <button id="sendBtn">Send</button>
      </div>
      <div class="error-msg" id="errorMsg"></div>
    </div>
  </div>

  <script>
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const errorEl = document.getElementById('errorMsg');
    const placeholder = document.getElementById('placeholder');

    const API_URL = 'http://localhost:9999/api/agent/chat';

    function renderContent(text) {
      const container = document.createElement('div');

      const blockRegex = /```(\w*)\n?([\s\S]*?)```/g;
      let lastIndex = 0;
      let parts = [];
      let match;

      while ((match = blockRegex.exec(text)) !== null) {
        if (match.index > lastIndex) {
          parts.push({ type: 'text', value: text.slice(lastIndex, match.index) });
        }
        parts.push({ type: 'code', lang: match[1], value: match[2] });
        lastIndex = match.index + match[0].length;
      }
      if (lastIndex < text.length) {
        parts.push({ type: 'text', value: text.slice(lastIndex) });
      }

      if (parts.length === 0) parts.push({ type: 'text', value: text });

      for (const part of parts) {
        if (part.type === 'code') {
          const pre = document.createElement('pre');
          const code = document.createElement('code');
          code.textContent = part.value;
          pre.appendChild(code);

          const btn = document.createElement('button');
          btn.className = 'copy-btn';
          btn.textContent = 'Copy';
          btn.addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(part.value);
              btn.textContent = 'Copied!';
              btn.classList.add('copied');
              setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
            } catch { btn.textContent = 'Failed'; }
          });
          pre.appendChild(btn);
          container.appendChild(pre);
        } else {
          const lines = part.value.split('\n');
          for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            const parts2 = line.split(/(`[^`]+`)/g);
            const p = document.createElement('p');
            for (const seg of parts2) {
              if (seg.startsWith('`') && seg.endsWith('`')) {
                const code = document.createElement('code');
                code.textContent = seg.slice(1, -1);
                p.appendChild(code);
              } else if (seg) {
                p.appendChild(document.createTextNode(seg));
              }
            }
            if (p.childNodes.length === 0) p.innerHTML = '<br>';
            container.appendChild(p);
          }
        }
      }

      return container;
    }

    function addMessage(type, text, isError) {
      placeholder?.remove();

      const div = document.createElement('div');
      div.className = `message ${type}`;

      if (type === 'ai') {
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = 'AI';
        div.appendChild(label);

        if (isError) {
          div.classList.add('error');
        }

        const textSpan = document.createElement('span');
        textSpan.className = 'text';
        textSpan.appendChild(renderContent(text));
        div.appendChild(textSpan);

        const pulse = document.createElement('div');
        pulse.className = 'dot-pulse';
        pulse.innerHTML = '<span></span><span></span><span></span>';
        div.appendChild(pulse);
      } else {
        div.textContent = text;
      }

      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    function setLoading(loading) {
      sendBtn.disabled = loading;
      inputEl.disabled = loading;
      if (loading) {
        inputEl.blur();
      } else {
        inputEl.focus();
      }
    }

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.add('visible');
    }

    function hideError() {
      errorEl.textContent = '';
      errorEl.classList.remove('visible');
    }

    async function sendMessage() {
      const message = inputEl.value.trim();
      if (!message) return;

      hideError();
      inputEl.value = '';
      addMessage('user', message);
      const aiMsg = addMessage('ai', '');
      aiMsg.classList.add('loading');
      setLoading(true);

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });

        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`Server error (${res.status}): ${errText}`);
        }

        const data = await res.json();

        aiMsg.classList.remove('loading');

        const textEl = aiMsg.querySelector('.text');
        textEl.innerHTML = '';
        if (data.response.startsWith('Error calling') || data.response.startsWith('No response received')) {
          textEl.appendChild(renderContent(data.response));
          aiMsg.classList.add('error');
          aiMsg.querySelector('.label').textContent = 'Error';
        } else {
          textEl.appendChild(renderContent(data.response));
        }
      } catch (err) {
        aiMsg.classList.remove('loading');
        const textEl = aiMsg.querySelector('.text');
        textEl.innerHTML = '';
        textEl.appendChild(renderContent(err.message || 'Network error. Is the server running?'));
        aiMsg.classList.add('error');
        aiMsg.querySelector('.label').textContent = 'Error';
      } finally {
        setLoading(false);
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
